services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - local_uploads:/var/www/html/public/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-travel_guide}
      POSTGRES_USER: ${DB_USER:-travel_guide}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-local-password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travel_guide} -d ${DB_NAME:-travel_guide}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres_data:
  local_uploads:
